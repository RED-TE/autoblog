<!-- login.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로그램 로그인</title>
    <!-- Firebase SDK 로드 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f7f9fc; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h1 { font-size: 24px; font-weight: 700; color: #1e293b; margin-bottom: 20px; }
        p { color: #64748b; font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
        .btn-google { background-color: #4285F4; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 100%; transition: background-color 0.2s; }
        .btn-google:hover { background-color: #3367D6; }
        .loader { display: none; margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #4285F4; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="login-box" id="loginView">
    <h1>프로그램 로그인</h1>
    <p>데스크톱 앱 연동을 위해<br>Google 계정으로 로그인/회원가입 해주세요.</p>
    <button class="btn-google" onclick="signInWithGoogle()">Google 연동하기</button>
</div>
<div class="login-box" id="loadingView" style="display: none;">
    <h1>인증 진행 중...</h1>
    <div class="loader" style="display: block;"></div>
    <p>데스크톱 앱으로 인증 정보를 전송하고 있습니다.<br>잠시만 기다려주세요.</p>
</div>
<script>
    // 1. Firebase Config 삽입 (파이썬 Base64 디코딩된 실 값 입력 필요)
    const firebaseConfig = {
        apiKey: "AIzaSyDwbR5ftgJID4cGt45N23eVCTiLWt5M2PE", // 복호화 된 값 적용
        authDomain: "recarauto-88950.firebaseapp.com",
        databaseURL: "https://recarauto-88950.firebaseio.com",
        projectId: "recarauto-88950",
        storageBucket: "recarauto-88950.appspot.com",
        messagingSenderId: "851749593786",
        appId: "1:851749593786:web:f114ba96d3dafcf261883"
    };

    // Firebase 초기화
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function signInWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        
        // 팝업으로 구글 로그인 (회원가입도 동일하게 처리됨)
        auth.signInWithPopup(provider).then((result) => {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('loadingView').style.display = 'block';
            
            // 인증 완료 후 IdToken 추츨
            return result.user.getIdToken();
        }).then((idToken) => {
            // 파이썬 로컬 서버로 토큰 리다이렉트
            window.location.href = "http://localhost:8080/callback?code=" + idToken;
        }).catch((error) => {
            alert("로그인/회원가입 중 에러가 발생했습니다: " + error.message);
        });
    }
</script>
</body>
</html>
